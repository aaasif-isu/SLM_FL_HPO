# code/eval/eval_config.yaml

eval:
  fl:
    enabled: true
    use_lora: false # false -> baseline FL, true -> LoRA-FL

    # model architecture (instead of reading model_config.yaml)
    model_name: "ResNet18"
    dataset_name: "cifar10"

    # dataset settings
    test_sample_fraction: 1.0
    eval_batch_size: 128

    # checkpoint paths
    ckpt_lora: "./best_model/r2_best_ResNet18_cifar10_c100_imb0.5_epochs30_splitfed_lora.pth"
    ckpt_nolora: "./best_model/r2_best_ResNet18_cifar10_c100_imb0.5_epochs30_splitfed_nolora.pth"

    # device
    device: "cuda:0"
    seed: 1025

    # notes (optional)
    notes: "Evaluation without reading training config."
    

  slm:
    enabled: true
    mode: "lora_clusters"    # or "lora_clusters" when testing LoRA

    base_model_id: "Qwen/Qwen2.5-0.5B-Instruct"
    slm_baseline_dir: "../runs/8888046_0/slm_baseline"
    slm_lora_dir: "../runs/8887985_1/slm_lora_adapters"
    cluster_adapter_subdirs: ["cluster:0", "cluster:1", "cluster:2"]

    num_clusters: 3

    prompt: |
      You are a hyperparameter selection assistant for federated learning.

      Task:
      - Suggest hyperparameters for BOTH client_hps and server_hps
        to train ResNet18 on CIFAR-10 with 1000 clients and non-IID=1.0,
        using SplitFed for 30 global epochs.

      Search space (you MUST respect these bounds):

      client_hps:
        learning_rate: float in [0.0001, 0.01]
        weight_decay:  float in [1e-6, 0.001]
        momentum:      float in [0.8, 0.99]
        optimizer:     one of ["AdamW", "SGD", "Adam"]
        scheduler:     one of ["CosineAnnealingLR", "StepLR", "None"]
        local_epochs:  integer in [1, 3]
        batch_size:    one of [8, 16, 32, 64, 128]
        dropout_rate:  float in [0.0, 0.5]

      server_hps:
        learning_rate: float in [0.0001, 0.01]
        momentum:      float in [0.8, 0.99]
        optimizer:     one of ["AdamW", "SGD", "Adam"]
        scheduler:     one of ["CosineAnnealingLR", "StepLR", "None"]

      mu:
        float in [0.0, 0.0] (so always 0.0)

      Output format (VERY IMPORTANT):
      - Reply ONLY in JSON.
      - Top-level keys MUST be exactly: "client_hps", "server_hps", "mu".
      - "client_hps" is an object with keys:
        ["learning_rate", "weight_decay", "momentum", "optimizer",
         "scheduler", "local_epochs", "batch_size", "dropout_rate"].
      - "server_hps" is an object with keys:
        ["learning_rate", "momentum", "optimizer", "scheduler"].
      - "mu" is a single float value.

      - Do NOT add any explanation, text, or comments outside the JSON.
      - All numeric values MUST lie strictly inside the allowed ranges.

      Example of valid format (values are just examples):
      {
        "client_hps": {
          "learning_rate": 0.001,
          "weight_decay": 0.00005,
          "momentum": 0.9,
          "optimizer": "AdamW",
          "scheduler": "CosineAnnealingLR",
          "local_epochs": 2,
          "batch_size": 64,
          "dropout_rate": 0.1
        },
        "server_hps": {
          "learning_rate": 0.0005,
          "momentum": 0.9,
          "optimizer": "AdamW",
          "scheduler": "None"
        },
        "mu": 0.0
      }

      Now produce your recommended JSON configuration.
    max_new_tokens: 256